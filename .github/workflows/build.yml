name: Maru_Ai

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'ตั้งชื่อเวอร์ชัน'
        required: true
        default: 'v1.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle 8.1.0
      run: |
        wget https://services.gradle.org/distributions/gradle-8.1.0-bin.zip
        unzip -q gradle-8.1.0-bin.zip
        echo "$PWD/gradle-8.1.0/bin" >> $GITHUB_PATH

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.1.0 --distribution-type bin

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MaruUpscaler-${{ github.event.inputs.version_tag }}
        path: app/build/outputs/apk/release/*.apk

    - name: Create GitHub Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version_tag }}
        name: Maru Upscaler ${{ github.event.inputs.version_tag }}
        files: app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false
