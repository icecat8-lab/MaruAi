name: Maru_Ai

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'ตั้งชื่อเวอร์ชัน (เช่น v1.0-debug)'
        required: true
        default: 'v1.0-debug'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.11.1'

    - name: Configure Gradle Properties
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.11.1
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MaruUpscaler-Debug-${{ github.event.inputs.version_tag }}
        path: app/build/outputs/apk/debug/*.apk

    - name: Create GitHub Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version_tag }}
        name: Maru Upscaler Debug ${{ github.event.inputs.version_tag }}
        files: app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
