name: Maru_Ai

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'ตั้งชื่อเวอร์ชัน (เช่น v1.0-debug)'
        required: true
        default: 'v1.0-debug'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.11.1'

    - name: Configure Gradle Properties
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties

    - name: Download NCNN prebuilt (Android + Vulkan)
      env:
        GH_TOKEN: ${{ github.token }}
        NCNN_TAG: ''
      run: |
        set -e
        mkdir -p /tmp/ncnn_dl /tmp/ncnn_x
        gh release download ${NCNN_TAG:+$NCNN_TAG} --repo Tencent/ncnn --pattern 'ncnn-*-android-vulkan.zip' --dir /tmp/ncnn_dl
        unzip -q /tmp/ncnn_dl/ncnn-*-android-vulkan.zip -d /tmp/ncnn_x
        SRC="$(find /tmp/ncnn_x -mindepth 1 -maxdepth 1 -type d | head -n 1)"
        mkdir -p app/src/main/cpp
        rm -rf app/src/main/cpp/ncnn
        mv "$SRC" app/src/main/cpp/ncnn
        test -d app/src/main/cpp/ncnn/arm64-v8a/lib/cmake/ncnn

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.11.1
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MaruUpscaler-Debug-${{ github.event.inputs.version_tag }}
        path: app/build/outputs/apk/debug/*.apk

    - name: Create GitHub Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version_tag }}
        name: Maru Upscaler Debug ${{ github.event.inputs.version_tag }}
        files: app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
